name: Notion task live sync tests

on:
  pull_request:
    paths:
      - "backend/config.py"
      - "backend/main.py"
      - "backend/notion_task_sync/**"
      - "backend/task_sync_queue.py"
      - "backend/worker.py"
      - "backend/tools/notion.py"
      - "backend/tools/task_reads.py"
      - "tests/test_notion_task_live_sync.py"
      - "tests/test_task_phase2_wiring.py"
      - "docs/notion_task_live_sync.md"
      - ".env.example"
      - "PROGRESS.md"
      - ".github/workflows/notion-task-live-sync-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet fastapi httpx pydantic chromadb tzdata timetree-exporter
      - name: Compile Python sources
        run: python -m compileall backend tests
      - name: Run task sync tests
        id: task-tests
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_notion_task_live_sync \
            tests.test_task_phase2_wiring \
            tests.test_task_conversation_flow \
            tests.test_task_cancel_status \
            -v 2>&1 | tee notion-task-live-sync-test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-task-live-sync-test-output
          path: notion-task-live-sync-test-output.txt
