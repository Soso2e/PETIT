name: iOS Mobile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/PETITMobile/**"
      - ".github/workflows/ios-mobile.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/PETITMobile
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios/PETITMobile
        run: |
          set -o pipefail
          xcodebuild \
            -project PETITMobile.xcodeproj \
            -scheme PETITMobile \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      - name: Select available iPhone Simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          DEVICE_ID=$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "simulators.json"
          payload = json.loads(path.read_text())
          for devices in payload.get("devices", {}).values():
              for device in devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          PY
          )
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: ios/PETITMobile
        run: |
          set -o pipefail
          xcodebuild \
            -project PETITMobile.xcodeproj \
            -scheme PETITMobile \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            CODE_SIGNING_ALLOWED=NO \
            test | xcpretty
