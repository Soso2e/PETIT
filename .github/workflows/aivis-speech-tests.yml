name: AivisSpeech TTS tests

on:
  pull_request:
    paths:
      - "backend/aivis_speech.py"
      - "backend/config.py"
      - "backend/main.py"
      - "frontend/index.html"
      - "frontend/mobile_audio_unlock.js"
      - "frontend/voice.js"
      - "scripts/diagnose_aivis_speech.py"
      - "tests/test_aivis_speech.py"
      - ".github/workflows/aivis-speech-tests.yml"
      - ".env.example"
      - "README.md"
      - "docs/aivis_speech.md"
      - "PROGRESS.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet httpx
      - name: Compile Python sources
        run: python -m compileall backend scripts tests
      - name: Check diagnostic CLI
        run: python scripts/diagnose_aivis_speech.py --help
      - name: Check voice JavaScript syntax
        run: |
          node --check frontend/mobile_audio_unlock.js
          node --check frontend/voice.js
      - name: Run AivisSpeech tests
        run: python -m unittest tests.test_aivis_speech -v
