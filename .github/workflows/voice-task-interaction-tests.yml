name: Voice task interaction tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/voice.js"
      - "tests/test_voice_task_interaction.py"
      - ".github/workflows/voice-task-interaction-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest tests.test_voice_task_interaction -v
      - run: python -m py_compile backend/brain.py backend/petit_prompt.py
      - run: node --check frontend/voice.js
