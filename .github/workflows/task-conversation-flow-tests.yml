name: Task conversation flow tests

on:
  pull_request:
    paths:
      - "backend/agent.py"
      - "backend/task_conversation.py"
      - "backend/tools/__init__.py"
      - "backend/tools/task_defaults.py"
      - "backend/tools/task_reads.py"
      - "frontend/action_confirm.js"
      - "frontend/index.html"
      - "tests/test_task_conversation_flow.py"
      - "tests/test_task_cancel_status.py"
      - "docs/task_conversation_flow.md"
      - "PROGRESS.md"
      - ".github/workflows/task-conversation-flow-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet fastapi httpx pydantic chromadb timetree-exporter
      - name: Compile Python sources
        run: python -m compileall backend tests
      - name: Check browser script syntax
        run: node --check frontend/action_confirm.js
      - name: Run task flow tests
        run: python -m unittest tests.test_task_conversation_flow tests.test_task_cancel_status -v
