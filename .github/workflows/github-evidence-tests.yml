name: GitHub evidence tests

on:
  push:
    branches: [feat/github-evidence, feat/github-daily-review]
  pull_request:
    paths:
      - "backend/config.py"
      - "backend/github*.py"
      - "backend/project_source_refresh.py"
      - "backend/project_resume.py"
      - "backend/briefing.py"
      - "backend/proactive.py"
      - "backend/tools/github*.py"
      - "tests/test_github*.py"
      - "tests/test_project_source_refresh.py"
      - "tests/test_project_resume.py"
      - ".github/workflows/github-evidence-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install fastapi httpx pydantic chromadb timetree-exporter
      - name: Compile
        run: python -m compileall backend tests
      - name: Test GitHub evidence and daily review
        run: python -m unittest tests.test_github_evidence tests.test_github_client_evidence tests.test_github_evidence_routing tests.test_github_daily_review tests.test_project_source_refresh tests.test_project_resume tests.test_linkraft_owner_sync tests.test_notion_adapter_v2
