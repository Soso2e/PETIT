name: GitHub evidence tests

on:
  push:
    branches: [feat/github-evidence]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install fastapi httpx pydantic chromadb timetree-exporter
      - name: Compile
        run: python -m compileall backend tests
      - name: Test GitHub evidence
        run: python -m unittest tests.test_github_evidence tests.test_project_source_refresh tests.test_project_resume tests.test_linkraft_owner_sync tests.test_notion_adapter_v2
