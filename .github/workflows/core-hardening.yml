name: Core hardening tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/test_core_hardening.py"
      - "tests/test_chat_context_budget.py"
      - "tests/test_schedule_date_parsing.py"
      - "tests/test_notion_search.py"
      - "tests/test_task_completion_intent.py"
      - "tests/test_life_map_assets.py"
      - ".github/workflows/core-hardening.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet fastapi uvicorn httpx pydantic chromadb timetree-exporter

      - name: Compile Python sources
        run: python -m compileall backend tests/test_core_hardening.py tests/test_chat_context_budget.py tests/test_schedule_date_parsing.py tests/test_notion_search.py tests/test_task_completion_intent.py tests/test_life_map_assets.py

      - name: Check frontend syntax
        run: |
          node --check frontend/app.js
          node --check frontend/app_shell.js
          node --check frontend/life-map.js

      - name: Run Life map asset tests
        run: python -m unittest tests.test_life_map_assets -v

      - name: Run existing core hardening tests
        run: |
          set +e
          python -m unittest tests.test_core_hardening -v > core-hardening.log 2>&1
          status=$?
          cat core-hardening.log
          exit $status

      - name: Upload failed core test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-hardening-failure-log
          path: core-hardening.log
          if-no-files-found: error
          retention-days: 7

      - name: Run chat context budget tests
        run: python -m unittest tests.test_chat_context_budget -v

      - name: Run schedule date parsing tests
        run: python -m unittest tests.test_schedule_date_parsing -v

      - name: Run Notion conversational search tests
        run: python -m unittest tests.test_notion_search -v

      - name: Run task completion intent tests
        run: python -m unittest tests.test_task_completion_intent -v
