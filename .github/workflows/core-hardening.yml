name: Core hardening tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/test_core_hardening.py"
      - "tests/test_chat_context_budget.py"
      - "tests/test_schedule_date_parsing.py"
      - ".github/workflows/core-hardening.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet fastapi uvicorn httpx pydantic chromadb timetree-exporter

      - name: Compile Python sources
        run: python -m compileall backend tests/test_core_hardening.py tests/test_chat_context_budget.py tests/test_schedule_date_parsing.py

      - name: Check frontend syntax
        run: node --check frontend/app.js

      - name: Run existing core hardening tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_core_hardening -v 2>&1 | tee core-test-output.txt

      - name: Upload core test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-output
          path: core-test-output.txt

      - name: Run chat context budget tests
        run: python -m unittest tests.test_chat_context_budget -v

      - name: Run schedule date parsing tests
        run: python -m unittest tests.test_schedule_date_parsing -v
