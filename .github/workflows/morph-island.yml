name: Morph Island component tests
on:
  pull_request:
    paths:
      - 'frontend/components/morph-island.js'
      - 'frontend/components/morph-island.css'
      - 'tests/test_morph_island.cjs'
      - '.github/workflows/morph-island.yml'
  push:
    branches:
      - feat/shared-morph-island
    paths:
      - 'frontend/components/morph-island.js'
      - 'frontend/components/morph-island.css'
      - 'tests/test_morph_island.cjs'
      - '.github/workflows/morph-island.yml'
jobs:
  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check frontend/components/morph-island.js
      - name: Run Morph Island tests
        run: node --test tests/test_morph_island.cjs
