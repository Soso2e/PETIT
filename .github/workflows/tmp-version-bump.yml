name: Temporary version bump

on:
  push:
    branches:
      - fix/openwakeword-desktop-runtime
    paths:
      - '.github/workflows/tmp-version-bump.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openwakeword-desktop-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bump Desktop version
        working-directory: desktop
        run: npm version 0.21.0 --no-git-tag-version
      - name: Sync Web and PROGRESS version
        shell: python
        run: |
          from pathlib import Path

          version_js = Path('frontend/petit-version.js')
          text = version_js.read_text(encoding='utf-8')
          text = text.replace('globalThis.PETIT_VERSION = "v0.20.0";', 'globalThis.PETIT_VERSION = "v0.21.0";', 1)
          text = text.replace('globalThis.PETIT_ASSET_VERSION = "0.20.0";', 'globalThis.PETIT_ASSET_VERSION = "0.21.0";', 1)
          version_js.write_text(text, encoding='utf-8')

          progress = Path('PROGRESS.md')
          text = progress.read_text(encoding='utf-8')
          text = text.replace('**Current Version: v0.20.0**', '**Current Version: v0.21.0**', 1)
          progress.write_text(text, encoding='utf-8')
      - name: Commit version synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package.json desktop/package-lock.json frontend/petit-version.js PROGRESS.md
          git diff --cached --check
          git commit -m "chore: v0.21.0へバージョン同期"
          git push origin HEAD:fix/openwakeword-desktop-runtime
