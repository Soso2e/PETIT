name: Contextual agent runtime tests

on:
  pull_request:
    paths:
      - "backend/dialogue_state.py"
      - "backend/dialogue_resolution.py"
      - "backend/conversation_state.py"
      - "backend/brain_runtime.py"
      - "backend/chat.py"
      - "backend/attachments.py"
      - "backend/vision.py"
      - "backend/vision_calculations.py"
      - "tests/test_vision.py"
      - "tests/test_vision_calculations.py"
      - "tests/fixtures/vision/**"
      - "frontend/chat_attachments.js"
      - "backend/pending_actions.py"
      - "backend/project_router.py"
      - "backend/task_completion_intent.py"
      - "tests/test_dialogue_state.py"
      - "tests/test_dialogue_resolution.py"
      - "tests/test_project_router_context_guard.py"
      - "tests/test_conversation_state.py"
      - "tests/test_brain_runtime.py"
      - "tests/test_action_reliability.py"
      - "tests/test_one_pass_router.py"
      - "backend/work_sessions.py"
      - "backend/tools/work_sessions.py"
      - "backend/notion_task_sync/store.py"
      - "backend/petit_prompt.py"
      - "backend/agent.py"
      - "backend/agent_runtime.py"
      - "backend/agent_state.py"
      - "backend/agent_progress.py"
      - "backend/capability_router.py"
      - "backend/workspace_context.py"
      - "backend/local_development.py"
      - "backend/config.py"
      - "backend/tools/local_development.py"
      - "backend/tools/builtins.py"
      - "tests/test_workspace_context.py"
      - "tests/test_local_development.py"
      - "backend/context_broker.py"
      - "backend/tools/schedule.py"
      - "backend/sona_core_schedule.py"
      - "backend/calendar_sync.py"
      - "tests/test_context_broker.py"
      - "tests/test_calendar_keyword_search.py"
      - "tests/test_sona_core_schedule.py"
      - "tests/test_calendar_sync.py"
      - "backend/tools/agent_actions.py"
      - "backend/tools/__init__.py"
      - "backend/tools/registry.py"
      - "backend/tools/task_hierarchy.py"
      - "frontend/app.js"
      - "frontend/action_confirm.js"
      - "tests/test_contextual_agent_runtime.py"
      - "tests/test_tool_risk_policy.py"
      - "tests/test_task_parent_confirmation_guard.py"
      - "docs/contextual_agent_runtime.md"
      - "docs/generic_lists.md"
      - "docs/runtime-flows.md"
      - "experiments/**"
      - "tests/test_ai_first_poc.py"
      - ".github/workflows/contextual-agent-runtime-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet fastapi httpx pydantic chromadb timetree-exporter pytest 'Pillow>=11.3,<13'
      - name: Compile Python sources
        run: python -m compileall backend tests experiments
      - name: Check frontend syntax
        run: |
          node --check frontend/app.js
          node --check frontend/action_confirm.js
          node --check frontend/chat_attachments.js
      - name: Run image intake and Vision regressions
        run: python -m pytest tests/test_vision.py tests/test_vision_calculations.py tests/test_chat_router.py tests/test_module_registry.py -q
      - name: Run contextual Agent tests
        run: |
          python -m unittest \
            tests.test_action_reliability \
            tests.test_ai_first_poc \
            tests.test_one_pass_router \
            tests.test_work_session_tools \
            tests.test_work_sessions \
            tests.test_dialogue_state \
            tests.test_dialogue_resolution \
            tests.test_project_router_context_guard \
            tests.test_conversation_state \
            tests.test_brain_runtime \
            tests.test_context_broker \
            tests.test_personal_context_broker \
            tests.test_task_hierarchy_idempotency \
            tests.test_contextual_agent_runtime \
            tests.test_tool_risk_policy \
            tests.test_task_parent_confirmation_guard \
            -v
      - name: Run local development observation regressions
        run: python -m unittest tests.test_workspace_context tests.test_local_development -v
      # Sona Core adapter tests need the private Sona-Agent-Core dependency and run locally.
      - name: Run calendar keyword regression tests
        run: |
          python -m unittest \
            tests.test_calendar_keyword_search \
            tests.test_calendar_sync \
            -v
      - name: Run related regression tests
        run: python -m unittest tests.test_generic_lists tests.test_task_conversation_flow tests.test_task_cancel_status -v
