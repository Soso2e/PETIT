name: Refresh PETIT shared icons
on:
  push:
    branches: [main]
    paths:
      - frontend/branding/petit-app-icon-source.png
      - scripts/generate_app_icons.py
      - .github/workflows/refresh-brand-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate app icon assets
        run: python scripts/generate_app_icons.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend ios/PETITMobile desktop/package.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: regenerate shared PETIT app icons [skip ci]'
            git push
          fi
