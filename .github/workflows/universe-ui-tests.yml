name: Universe UI tests

on:
  pull_request:
    paths:
      - "backend/task_list_api.py"
      - "backend/capability_router.py"
      - "backend/work_sessions.py"
      - "backend/tools/__init__.py"
      - "backend/tools/task_hierarchy.py"
      - "frontend/index.html"
      - "frontend/legacy.html"
      - "frontend/universe.html"
      - "frontend/universe.css"
      - "frontend/universe-actions.css"
      - "frontend/universe-app.js"
      - "frontend/universe-next.css"
      - "frontend/universe-next.js"
      - "tests/test_universe_ui.py"
      - "tests/test_task_phase2_wiring.py"
      - "docs/universe_focus_orbit.md"
      - ".github/workflows/universe-ui-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "fastapi>=0.110" "pydantic>=2.6" "httpx>=0.27"
      - name: Check syntax
        run: |
          python -m py_compile backend/task_list_api.py backend/capability_router.py backend/tools/task_hierarchy.py tests/test_universe_ui.py
          node --check frontend/universe-app.js
          node --check frontend/universe-next.js
      - name: Run Universe UI tests
        run: python -m unittest tests.test_universe_ui -v
