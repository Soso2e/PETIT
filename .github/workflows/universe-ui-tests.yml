name: Universe UI tests

on:
  pull_request:
    paths:
      - "backend/agent.py"
      - "backend/capability_router.py"
      - "backend/time_context.py"
      - "backend/task_list_api.py"
      - "backend/task_hierarchy.py"
      - "backend/reminders.py"
      - "backend/work_sessions.py"
      - "backend/tools/__init__.py"
      - "backend/tools/task_hierarchy.py"
      - "backend/tools/reminders.py"
      - "frontend/index.html"
      - "frontend/legacy.html"
      - "frontend/universe.html"
      - "frontend/universe.css"
      - "frontend/universe-actions.css"
      - "frontend/universe-app.js"
      - "frontend/universe-next.css"
      - "frontend/universe-next.js"
      - "frontend/univ-space.js"
      - "frontend/universe-render-scheduler.js"
      - "frontend/universe-3d-foundation.css"
      - "frontend/universe-webgl-hierarchy.js"
      - "frontend/universe-webgl-scene.js"
      - "frontend/universe-webgl-scene.css"
      - "frontend/universe-webgl-bridge.js"
      - "frontend/petit-version.js"
      - "frontend/reminders.css"
      - "frontend/reminders.js"
      - "frontend/service-worker.js"
      - "tests/test_universe_ui.py"
      - "tests/test_univ_pointer_interaction.py"
      - "tests/test_universe_webgl_scene.py"
      - "tests/test_universe_fixed_viewport.py"
      - "tests/test_universe_render_scheduler.py"
      - "tests/test_univ_3d_hierarchy.py"
      - "tests/test_task_phase2_wiring.py"
      - "tests/test_reminders.py"
      - "tests/test_reminder_ui.py"
      - "tests/test_current_time_and_desktop_ui.py"
      - "docs/universe_focus_orbit.md"
      - "docs/reminders.md"
      - ".github/workflows/universe-ui-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install minimal test dependencies
        run: python -m pip install "fastapi>=0.110" "pydantic>=2.6" "httpx>=0.27"
      - name: Check syntax
        run: |
          python -m py_compile backend/agent.py backend/capability_router.py backend/time_context.py backend/task_list_api.py backend/task_hierarchy.py backend/reminders.py backend/tools/task_hierarchy.py backend/tools/reminders.py tests/test_universe_ui.py tests/test_universe_webgl_scene.py tests/test_universe_fixed_viewport.py tests/test_universe_render_scheduler.py tests/test_univ_3d_hierarchy.py tests/test_univ_pointer_interaction.py tests/test_reminders.py tests/test_reminder_ui.py tests/test_current_time_and_desktop_ui.py
          node --check frontend/universe-app.js
          node --check frontend/universe-next.js
          node --check frontend/univ-space.js
          node --check frontend/universe-render-scheduler.js
          node --check frontend/universe-webgl-hierarchy.js
          node --check frontend/universe-webgl-scene.js
          node --check frontend/universe-webgl-bridge.js
          node --check frontend/petit-version.js
          node --check frontend/reminders.js
          node --check frontend/service-worker.js
      - name: Run Universe UI, WebGL, reminder, and time-context tests
        run: python -m unittest tests.test_universe_ui tests.test_universe_webgl_scene tests.test_universe_fixed_viewport tests.test_universe_render_scheduler tests.test_univ_3d_hierarchy tests.test_univ_pointer_interaction tests.test_reminders tests.test_reminder_ui tests.test_current_time_and_desktop_ui -v
