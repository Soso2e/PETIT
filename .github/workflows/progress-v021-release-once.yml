name: Record v0.21.0 release once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/progress-v021-release-once.yml'

permissions:
  contents: write

jobs:
  record-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update PROGRESS and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('PROGRESS.md')
          text = path.read_text(encoding='utf-8')

          old = '実`v0.21.0`タグ作成とGitHub Release実行は未実施。'
          new = '`v0.21.0`タグをrelease準備済みmain（`9b6a517`）へ作成し、Desktop Release Run #92でtest・macOS arm64・Windows x64・GitHub Release作成が全て成功。`PETIT-0.21.0-mac-arm64.dmg` / `PETIT-0.21.0-win-x64.exe` をReleaseへ添付済み。macOSは署名資格情報未設定のため個人利用向け未署名DMG。'
          if old not in text:
              raise SystemExit('Release status marker was not found in PROGRESS.md')
          text = text.replace(old, new, 1)

          old_next = '- 次にやること: GitHub Actionsの`Create PETIT Desktop Release`を実行し、`v0.21.0`タグ作成→tag refでDesktop Releaseを起動→DMG/EXE付きGitHub Release生成を確認する。その後Issue #270で実モデル配布・自動設定diagnostic・実マイク`ready`・実声/誤起動評価を継続し、Issue #235の実LM Studio検証へ戻る。'
          new_next = '- 次にやること: v0.21.0 ReleaseのWindows EXE / macOS DMGを実機インストールして更新・設定保持を受入確認する。WakeはIssue #270で実モデル配布・自動設定diagnostic・実マイク`ready`・実声/誤起動評価を継続し、その後Issue #235の実LM Studio検証へ戻る。'
          if old_next not in text:
              raise SystemExit('Next-action marker was not found in PROGRESS.md')
          text = text.replace(old_next, new_next, 1)

          row = '| 2026-09-12 | 13:02 | #81 | v0.21.0を正式Release。タグは`9b6a517`へ作成し、Run #92でtest・macOS arm64未署名DMG・Windows x64 EXE・packaged Wake resources・GitHub Release作成が全て成功。Release資産2件を公開。Wakeモデルは未同梱で、実機Wake受入はIssue #270で継続。 |'
          if row not in text:
              text = text.rstrip() + '\n' + row + '\n'
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/progress-v021-release-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESS.md
          git commit -m "docs: v0.21.0 Release成功を記録"
          git push origin HEAD:main
