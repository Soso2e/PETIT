name: Temporary PROGRESS finalize

on:
  push:
    branches:
      - fix/openwakeword-desktop-runtime
    paths:
      - '.github/workflows/tmp-progress-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openwakeword-desktop-runtime
          fetch-depth: 0
      - name: Finalize PROGRESS handoff
        shell: python
        run: |
          from pathlib import Path
          path = Path('PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('PR #272はDraft継続。', 'PR #272で実装済み。', 1)
          text = text.replace('packaged EXE/DMGへのWakeモデル同梱と実マイク`ready`確認はStep 3で行う。', 'packaged配布経路はStep 3で実装済み。実モデル同梱build・実マイク`ready`・実声評価は未完了。', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit PROGRESS final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESS.md
          git diff --cached --check
          git commit -m "docs: Wake実装の引継ぎ状態を確定"
          git push origin HEAD:fix/openwakeword-desktop-runtime
