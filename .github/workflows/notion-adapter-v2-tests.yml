name: Notion adapter v2 tests

on:
  push:
    branches:
      - feat/notion-adapter-v2
  pull_request:
    paths:
      - "backend/config.py"
      - "backend/notion_client.py"
      - "backend/notion_project_sync.py"
      - "backend/notion_project_links.py"
      - "backend/project_resume.py"
      - "backend/tools/notion.py"
      - "backend/tools/notion_projects.py"
      - "backend/tools/__init__.py"
      - "tests/test_notion_adapter_v2.py"
      - "tests/test_project_resume.py"
      - ".github/workflows/notion-adapter-v2-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic chromadb timetree-exporter
      - name: Compile Python sources
        run: python -m compileall backend tests
      - name: Run Notion adapter and project resume tests
        run: python -m unittest tests.test_notion_adapter_v2 tests.test_project_resume
