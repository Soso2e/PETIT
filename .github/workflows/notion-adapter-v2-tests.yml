name: Notion adapter v2 tests

on:
  pull_request:
    paths:
      - "backend/config.py"
      - "backend/db.py"
      - "backend/notion_client.py"
      - "backend/notion_project_sync.py"
      - "backend/notion_project_links.py"
      - "backend/project_resume.py"
      - "backend/task_sync_queue.py"
      - "backend/worker.py"
      - "backend/tools/notion.py"
      - "backend/tools/notion_projects.py"
      - "backend/tools/tasks.py"
      - "backend/tools/tasks_phase2.py"
      - "backend/tools/__init__.py"
      - "tests/test_notion_adapter_v2.py"
      - "tests/test_project_resume.py"
      - "tests/test_task_write_queue.py"
      - ".github/workflows/notion-adapter-v2-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet fastapi httpx pydantic chromadb timetree-exporter
      - name: Compile Python sources
        run: python -m compileall backend tests
      - name: Run Notion adapter, project resume, and task queue tests
        run: >-
          python -m unittest
          tests.test_notion_adapter_v2
          tests.test_project_resume
          tests.test_task_write_queue
          -v
