name: Desktop checks and packages

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/desktop/**'
      - 'frontend/voice.js'
      - 'scripts/wakeword/runtime.py'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax checks
        run: |
          for file in *.cjs *.js ../frontend/desktop/*.js ../frontend/voice.js; do node --check "$file"; done
          python3 -m py_compile ../scripts/wakeword/runtime.py
      - name: Validate release tag matches Desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match desktop/package.json ($expected)."
            exit 1
          fi

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke

      - name: Detect macOS release credentials
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "HAS_MAC_RELEASE_CREDS=true" >> "$GITHUB_ENV"
            echo "macOS release credentials found; building a signed and notarized release."
          else
            echo "HAS_MAC_RELEASE_CREDS=false" >> "$GITHUB_ENV"
            echo "::notice::macOS release credentials are incomplete; building an unsigned personal-use DMG instead."
          fi

      - name: Build development installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || matrix.platform != 'mac' }}
        run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build unsigned macOS personal-use release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac' && env.HAS_MAC_RELEASE_CREDS != 'true'
        run: npm run build -- --mac --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build signed and notarized macOS release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac' && env.HAS_MAC_RELEASE_CREDS == 'true'
        run: npm run build -- --mac --arm64 -c.mac.notarize=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS signature and Gatekeeper assessment
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac' && env.HAS_MAC_RELEASE_CREDS == 'true'
        shell: bash
        run: |
          app_path="$(find dist/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::Packaged .app was not found."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          dmg="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::DMG was not found."
            exit 1
          fi
          xcrun stapler validate "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: PETIT-${{ matrix.platform }}-${{ matrix.arch }}-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'development' }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/smoke-overlay.png
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release tag to point to main history
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in main."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: PETIT-*-release
          merge-multiple: true
      - name: Create GitHub Release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          installers=(release-assets/*.dmg release-assets/*.exe)
          if [ ${#installers[@]} -ne 2 ]; then
            echo "Expected one DMG and one EXE, found ${#installers[@]} installer(s)."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${installers[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "PETIT $GITHUB_REF_NAME"
