name: Desktop checks and packages

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/desktop/**'
      - 'frontend/voice.js'
      - 'scripts/wakeword/runtime.py'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      wake_model_url:
        description: 'HTTPS URL for hey_petit.onnx'
        required: false
        type: string
      wake_model_sha256:
        description: 'SHA-256 for hey_petit.onnx'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'frontend/desktop/**'
      - 'frontend/voice.js'
      - 'scripts/wakeword/runtime.py'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax checks
        run: |
          for file in *.cjs *.js scripts/*.cjs ../frontend/desktop/*.js ../frontend/voice.js; do node --check "$file"; done
          python3 -m py_compile ../scripts/wakeword/runtime.py
      - name: Validate release tag matches Desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match desktop/package.json ($expected)."
            exit 1
          fi

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PETIT_WAKE_MODEL_REQUIRED: ${{ (((github.event.inputs.wake_model_url || vars.PETIT_WAKE_MODEL_URL || '') != '') || ((github.event.inputs.wake_model_sha256 || vars.PETIT_WAKE_MODEL_SHA256 || '') != '')) && '1' || '0' }}
      PETIT_WAKE_MODEL_URL: ${{ github.event.inputs.wake_model_url || vars.PETIT_WAKE_MODEL_URL || '' }}
      PETIT_WAKE_MODEL_SHA256: ${{ github.event.inputs.wake_model_sha256 || vars.PETIT_WAKE_MODEL_SHA256 || '' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke

      - name: Report Wake model packaging mode
        shell: bash
        run: |
          if [ "$PETIT_WAKE_MODEL_REQUIRED" = "1" ]; then
            echo "Wake model distribution is configured; hey_petit.onnx and SHA-256 verification are required."
          else
            echo "::notice::Wake model distribution is not configured. Building a valid PETIT installer without hey_petit.onnx; Wake acceptance remains tracked separately."
          fi

      - name: Build development installer
        if: matrix.platform != 'mac'
        run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build ad-hoc macOS development installer
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac'
        run: npm run build:mac:development
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build ad-hoc macOS personal release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac'
        run: npm run build:mac:personal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged Wake resources
        run: npm run test:package-resources

      - uses: actions/upload-artifact@v4
        with:
          name: PETIT-${{ matrix.platform }}-${{ matrix.arch }}-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'development' }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/smoke-overlay.png
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release tag to point to main history
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in main."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: PETIT-*-release
          merge-multiple: true
      - name: Create GitHub Release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          installers=(release-assets/*.dmg release-assets/*.exe)
          if [ ${#installers[@]} -ne 2 ]; then
            echo "Expected one DMG and one EXE, found ${#installers[@]} installer(s)."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${installers[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "PETIT $GITHUB_REF_NAME"
