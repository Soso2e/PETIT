name: Desktop checks and packages

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/desktop/**'
      - 'frontend/voice.js'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax checks
        run: |
          for file in *.cjs *.js ../frontend/desktop/*.js ../frontend/voice.js; do node --check "$file"; done

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
      - name: Build development installer (no publishing)
        run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: PETIT-${{ matrix.platform }}-${{ matrix.arch }}-development
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/smoke-overlay.png
          if-no-files-found: error
          retention-days: 14
