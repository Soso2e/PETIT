name: Project source refresh tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/notion_project_sync.py"
      - "tests/test_removed_integrations.py"
      - "tests/test_notion_adapter_v2.py"
      - ".github/workflows/project-source-refresh-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic chromadb timetree-exporter
      - name: Compile Python sources
        run: python -m compileall backend tests
      - name: Run Notion project sync regressions
        run: |
          python -m unittest \
            tests.test_removed_integrations \
            tests.test_notion_adapter_v2
