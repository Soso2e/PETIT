name: BRAIN project mapping tests

on:
  push:
    branches: [feat/brain-project-mapping]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Fix project alias ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/brain_project_sync.py")
          text = path.read_text(encoding="utf-8")
          old = '"SELECT alias FROM project_aliases WHERE project_id=? ORDER BY id",'
          new = '"SELECT alias FROM project_aliases WHERE project_id=? ORDER BY created_at, normalized_alias",'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          if git diff --quiet -- backend/brain_project_sync.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/brain_project_sync.py
          git commit -m "fix: order project aliases by existing columns"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install fastapi httpx pydantic chromadb timetree-exporter
      - name: Compile
        run: python -m compileall backend tests
      - name: BRAIN candidate discovery
        run: python -m unittest tests.test_brain_candidate_discovery -v
      - name: Candidate exclusion boundary
        run: python -m unittest tests.test_brain_project_mapping.BrainProjectMappingTests.test_discovery_creates_candidate_but_not_source_link
      - name: Path safety
        run: python -m unittest tests.test_brain_project_mapping.BrainProjectMappingTests.test_explicit_inspection_rejects_private_outside_and_non_markdown
      - name: Confirmed mapping
        run: python -m unittest tests.test_brain_project_mapping.BrainProjectMappingTests.test_link_requires_confirmation_and_builds_bounded_cache
      - name: Hash event idempotency
        run: python -m unittest tests.test_brain_project_mapping.BrainProjectMappingTests.test_content_change_creates_one_idempotent_event
      - name: Project source boundary
        run: python -m unittest tests.test_brain_project_mapping.BrainProjectMappingTests.test_source_refresh_reads_only_confirmed_target_note
      - name: Missing note fallback
        run: python -m unittest tests.test_brain_project_mapping.BrainProjectMappingTests.test_missing_note_keeps_cache_and_checkpoint_for_resume
      - name: Bounded resume excerpt
        run: python -m unittest tests.test_brain_project_mapping.BrainProjectMappingTests.test_resume_excerpt_is_bounded
      - name: Source adapter regressions
        run: python -m unittest tests.test_project_source_refresh tests.test_project_resume tests.test_github_evidence tests.test_linkraft_owner_sync tests.test_notion_adapter_v2
