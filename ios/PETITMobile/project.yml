name: PETITMobile

options:
  bundleIdPrefix: com.soso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

schemes:
  PETITMobile:
    build:
      targets:
        PETITMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PETITMobileTests

targets:
  PETITMobile:
    type: application
    platform: iOS
    sources:
      - path: PETITMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soso.PETITMobile
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: PETIT
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  PETITMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PETITMobileTests
    dependencies:
      - target: PETITMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soso.PETITMobileTests
        GENERATE_INFOPLIST_FILE: true
