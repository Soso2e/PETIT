<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PETIT マスコット</title>
  <link rel="stylesheet" href="mascot/petit-mascot.css">
  <link rel="stylesheet" href="pet.css">
</head>
<body data-mode="idle">
  <div id="pet-drag" title="ここをドラッグして移動" aria-hidden="true"></div>
  <button id="pet-hide" type="button" aria-label="マスコットを隠す" title="マスコットを隠す">×</button>
  <span class="pet-caption" id="pet-status" role="status"></span>
  <button id="pet-open" type="button" aria-label="PETITを開く" title="PETITを開く">
    <span id="pet-art" aria-hidden="true"></span>
  </button>
  <script src="mascot/petit-mascot.js"></script>
  <script src="pet.js"></script>
</body>
</html>
