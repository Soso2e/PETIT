<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>PETIT 開発タスク</title><link rel="stylesheet" href="/static/setup.css"><link rel="stylesheet" href="/static/development.css"><script src="/static/development.js" defer></script></head>
<body><main>
<header><a href="/static/universe.html">PETITへ戻る</a><p class="eyebrow">PETIT / DEVELOPMENT</p><h1>CLIに開発をお願いする</h1><p>対象と目的を確認してから開始します。進捗・差分・未確認事項をここで確認できます。</p></header>
<p id="notice" role="status" aria-live="polite"></p><p id="login" hidden><a href="/static/setup.html">初期設定で管理者ログイン・CLI接続を行う</a></p>
<div id="content" hidden>
<section class="card"><h2>開発を依頼</h2>
<form id="proposal"><label>許可したリポジトリ<select id="repository" required></select></label><label>実行するCLI<select id="provider"><option value="codex">Codex CLI</option><option value="antigravity_cli">Antigravity CLI</option></select></label>
<label>お願いしたいこと<textarea id="goal" required maxlength="8000" rows="4" placeholder="目的、期待する挙動、変更しないものを書いてください"></textarea></label>
<p class="muted">開始コミットの専用コピーで調査・編集します。元フォルダの未コミット変更は含みません。ファイル削除、任意Shell、Push、PR作成、マージは行いません。</p>
<button type="submit" id="propose">対象と依頼を確認する</button></form></section>
<section class="card"><h2>進行中・これまでの依頼</h2><button id="refresh" class="quiet">状態を更新</button><div id="jobs"></div></section>
<details class="card"><summary>開発を許可するリポジトリ</summary><p>サーバーPC上のGitルートを1行に1件、最大8件指定します。PC全体の探索は行いません。</p><label>ローカルGitルート<textarea id="repositories" rows="4" maxlength="8000"></textarea></label><button id="save-roots">許可するリポジトリを保存</button></details>
</div></main></body></html>
