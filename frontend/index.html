<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PETIT" />
  <title>PETIT — Personal AI Assistant</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/companion.css" />
  <link rel="stylesheet" href="/static/notifications.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>PETIT</h1>
      <span id="app-version" class="status status--unknown" title="起動中のPETITバージョン">v…</span>
      <span id="status" class="status status--unknown">接続確認中…</span>
      <div class="header-actions">
        <button id="notification-toggle" type="button" class="notification-toggle" aria-pressed="false" aria-expanded="false">通知</button>
        <button id="voice-toggle" type="button" class="voice-toggle" aria-pressed="false">音声応答 OFF</button>
      </div>
      <div class="header-meta">
        <span id="session-label" class="session-label">現在の会話</span>
        <button id="history-toggle" type="button" class="history-toggle" aria-expanded="false" hidden>履歴を見る</button>
      </div>
    </header>

    <section id="notification-panel" class="notification-panel" aria-label="通知センター" hidden>
      <div class="notification-panel__head">
        <div class="notification-panel__title-row">
          <h2>通知センター</h2>
          <span id="notification-unread" class="notification-panel__badge">未読なし</span>
        </div>
        <button id="notification-refresh" type="button" class="notification-panel__refresh">更新</button>
      </div>

      <div class="notification-inbox" aria-live="polite">
        <div class="notification-filters" role="group" aria-label="通知の表示切り替え">
          <button type="button" class="notification-filter notification-filter--active" data-notification-state="open">未解決</button>
          <button type="button" class="notification-filter" data-notification-state="resolved">解決済み</button>
        </div>
        <p id="notification-empty" class="notification-empty">通知はまだありません。</p>
        <div id="notification-list" class="notification-list"></div>
      </div>

      <details class="notification-settings">
        <summary>Push通知の設定</summary>
        <p id="notification-state" class="notification-panel__state" role="status" aria-live="polite">通知状態を確認中…</p>
        <div id="notification-categories" class="notification-categories"></div>
        <div class="notification-panel__actions">
          <button id="notification-enable" type="button">この端末で有効にする</button>
          <button id="notification-test" type="button" disabled>テスト通知</button>
          <button id="notification-disable" type="button" hidden>この端末の通知を解除</button>
        </div>
      </details>
    </section>

    <section id="companion-dashboard" class="companion-dashboard" aria-label="制作伴走ダッシュボード">
      <article class="companion-card companion-card--work">
        <div class="companion-card__head">
          <h2 class="companion-card__title">今やってること</h2>
          <span id="work-state-label" class="companion-card__state">待機中</span>
        </div>
        <input id="work-task" class="work-task" type="text" maxlength="160" placeholder="例：Unityの壁塗り処理を実装" />
        <div class="work-main-row">
          <strong id="work-elapsed" class="work-elapsed">0分</strong>
          <select id="work-frequency" class="work-frequency" aria-label="PETITの声かけ頻庚">
            <option value="10">10分ごと</option>
            <option value="20">20分ごと</option>
            <option value="boundary">区切りだけ</option>
            <option value="quiet">静かにする</option>
          </select>
        </div>
        <div class="work-actions">
          <button id="work-toggle" type="button" class="work-button">作業開始</button>
          <button id="work-pause" type="button" class="work-secondary" hidden>一時停止</button>
          <button id="work-check-now" type="button" class="work-secondary" hidden>今声かけて</button>
          <button id="work-end" type="button" class="work-secondary" hidden>終了</button>
        </div>
      </article>

      <article class="companion-card">
        <div class="companion-card__head">
          <h2 class="companion-card__title">次にやる</h2>
          <button id="dashboard-refresh" type="button" class="dashboard-refresh" aria-label="今日の情報を更新">更新</button>
        </div>
        <p id="dashboard-next" class="dashboard-line">今日の次の一手を取得中…</p>
        <p id="dashboard-schedule" class="dashboard-line">予定を取得中…</p>
      </article>

      <article class="companion-card">
        <div class="companion-card__head">
          <h2 class="companion-card__title">Highタスク</h2>
        </div>
        <ul id="dashboard-tasks" class="dashboard-list"><li>取得中…</li></ul>
      </article>
    </section>

    <section class="model-routing" aria-label="使用モデルの切り替え">
      <label class="model-routing__field" for="chat-model-select">
        <span>Chat:</span>
        <select id="chat-model-select" aria-label="Chatモデル"></select>
      </label>
      <label class="model-routing__field" for="agent-model-select">
        <span>Agent:</span>
        <select id="agent-model-select" aria-label="Agentモデル"></select>
      </label>
      <span id="model-routing-state" class="model-routing__state" role="status" aria-live="polite"></span>
    </section>

    <main id="messages" class="messages">
      <div class="msg msg--assistant" id="greeting">
        <div class="bubble">こんにちは。PETIT です。今日のタスクや予定、覚えておきたいことなど、なんでも話しかけてください。</div>
      </div>
    </main>

    <div id="voice-state" class="voice-state" role="status" aria-live="polite"></div>

    <form id="chat-form" class="composer">
      <button id="mic" type="button" class="mic" aria-label="音声入力を開始" title="押して話す">🎤</button>
      <textarea id="input" class="input" rows="1" placeholder="メッセージを入力（Enterで送信 / Shift+Enterで改行）"></textarea>
      <button id="send" type="submit" class="send">送信</button>
    </form>
  </div>

  <section id="task-panel" class="task-panel" aria-label="タスク詳細" aria-hidden="true" hidden>
    <div class="task-panel__backdrop" data-task-close></div>
    <div class="task-panel__sheet">
      <header class="task-panel__head">
        <div>
          <span class="task-panel__eyebrow">タスク詳細</span>
          <h2 id="task-panel-title">タスク</h2>
        </div>
        <button id="task-close" type="button" class="task-panel__close" aria-label="タスク詳細を閉じる">閉じる</button>
      </header>
      <form id="task-form" class="task-form">
        <label>
          <span>タスク名</span>
          <input name="title" type="text" required maxlength="240" />
        </label>
        <div class="task-form__grid">
          <label>
            <span>状態</span>
            <select name="status">
              <option value="Yet">Yet</option>
              <option value="Now">Now</option>
              <option value="Done">Done</option>
            </select>
          </label>
          <label>
            <span>期限</span>
            <input name="due_date" type="date" />
          </label>
          <label>
            <span>優先度</span>
            <select name="priority">
              <option value="High">High</option>
              <option value="Mid">Mid</option>
              <option value="Low">Low</option>
            </select>
          </label>
          <label>
            <span>エリア</span>
            <select name="area">
              <option value="">未設定</option>
              <option value="personal">個人</option>
              <option value="group">グループ</option>
              <option value="university">大学</option>
              <option value="work">仕事</option>
            </select>
          </label>
        </div>
        <label>
          <span>メモ</span>
          <textarea name="reason" rows="3" maxlength="1000"></textarea>
        </label>
        <p id="task-state" class="task-panel__state" role="status" aria-live="polite"></p>
        <div class="task-panel__actions">
          <button id="task-complete" type="button" class="task-panel__complete">完了にする</button>
          <button type="submit" class="task-panel__save">変更を保存</button>
        </div>
      </form>
    </div>
  </section>

  <script src="/static/session.js"></script>
  <script src="/static/version.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/notifications.js"></script>
  <script src="/static/action_confirm.js"></script>
  <script src="/static/mobile_audio_unlock.js"></script>
  <script src="/static/voice.js"></script>
  <script src="/static/companion.js"></script>
</body>
</html>
